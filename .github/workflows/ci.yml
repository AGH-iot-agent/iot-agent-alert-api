name: CI

on:
  push:
    branches: [ main, feat/IOTAG-01-alert-api]
  pull_request:
    branches: [ main, feat/IOTAG-01-alert-api]

jobs:
  pipeline:
    uses: AGH-iot-agent/common-pipeline/.github/workflows/common-pipeline.yml@feat/IOTAG-01-common-pipeline
    secrets: inherit
    with:
      service_name: iot-agent-alert-api
      project_type: maven
      java_version: "21"
      values_file: Helm/values-dev.yaml
      chart_type: deployment
      namespace: iot-agent
